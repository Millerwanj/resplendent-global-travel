<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Payments | Resplendent Global Travel Solutions</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico"><link rel="stylesheet" href="assets/css/main.css?v=11.7.27">
<style>
.pay-shell{max-width:820px;margin:0 auto}.pay-card{background:#fff;border:1px solid rgba(23,63,58,.18);padding:42px;margin-top:24px}.pay-kicker{letter-spacing:.14em;text-transform:uppercase;font-size:12px}.pay-title{font-family:"Cormorant Garamond",Georgia,serif;font-size:42px;margin:10px 0}.pay-copy{line-height:1.75;max-width:650px}.pay-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.pay-button{display:inline-block;border:1px solid #173f3a;padding:13px 20px;background:#173f3a;color:#fff;text-decoration:none;cursor:pointer}.pay-button.secondary{background:transparent;color:#173f3a}.pay-ref{font-size:13px;color:#666;margin-top:20px;overflow-wrap:anywhere}.pay-error{color:#7d2e2e}.pay-ok{color:#173f3a}

.site-header.scrolled {
  background: #123C37 !important;
  border-bottom-color: rgba(166,129,60,.35) !important;
}
.site-header .brand-lockup strong {
  color: #fff !important;
}
.site-header .brand-lockup small {
  color: #A6813C !important;
}
body {
  background: #F6F2E9 !important;
}
.pay-card {
  border-color: rgba(23,63,58,.22) !important;
}
.pay-kicker,
.pay-title,
.pay-ref {
  color: #173F3A !important;
}
.pay-button {
  background: #173F3A !important;
  border-color: #173F3A !important;
  color: #fff !important;
}
.pay-button:hover {
  background: #123C37 !important;
  border-color: #123C37 !important;
}
.pay-button.secondary {
  background: transparent !important;
  color: #173F3A !important;
}
.pay-button.secondary:hover {
  background: rgba(23,63,58,.06) !important;
}

</style></head><body>
<header class="site-header scrolled"><div class="container header-inner"><a class="brand brand-lockup" href="index.html"><img alt="Resplendent Global Travel Solutions" src="assets/images/logo-r.png"><span><strong>RESPLENDENT</strong><small>GLOBAL TRAVEL SOLUTIONS</small></span></a></div></header>
<main id="main"><section class="section"><div class="container pay-shell"><div class="pay-card" id="payment-card">
<p class="pay-kicker">Secure Payments</p><h1 class="pay-title" id="pay-title">Payment information</h1>
<p class="pay-copy" id="pay-copy">Use a secure payment request linked to your confirmed Resplendent invoice.</p>
<div class="pay-actions" id="pay-actions"><a class="pay-button secondary" href="contact.html?purpose=Accounts%20%26%20Billing">Contact Accounts</a></div>
<p class="pay-ref" id="pay-ref"></p>
</div></div></section></main>
<script>
(function(){
 const q=new URLSearchParams(location.search), status=(q.get('payment')||'').toLowerCase(), invoice=q.get('invoice')||'', tracking=q.get('tracking')||'';
 const title=document.getElementById('pay-title'), copy=document.getElementById('pay-copy'), actions=document.getElementById('pay-actions'), ref=document.getElementById('pay-ref');
 const contact='<a class="pay-button secondary" href="contact.html?purpose=Accounts%20%26%20Billing">Contact Accounts</a>';
 if(status==='completed'){
   title.textContent='Payment received';
   copy.textContent='Thank you. Your payment has been verified and applied to your Resplendent invoice.';
   actions.innerHTML=(invoice&&tracking?'<a class="pay-button" href="/api/payments/receipt.php?invoice='+encodeURIComponent(invoice)+'&tracking='+encodeURIComponent(tracking)+'">View receipt</a>':'')+contact;
 } else if(status==='failed'){
   title.textContent='Payment not completed'; copy.textContent='We could not verify a completed payment. No service will be released until payment is confirmed.'; actions.innerHTML=contact;
 } else if(status==='pending'){
   title.textContent='Payment verification in progress'; copy.textContent='Your payment is being verified. Please do not make a second payment. If confirmation is delayed, our reconciliation process will continue checking it.'; actions.innerHTML=contact;
 } else if(q.get('cancelled')){
   title.textContent='Payment cancelled'; copy.textContent='The checkout was cancelled. Your invoice remains unchanged.'; actions.innerHTML=contact;
 } else if(invoice){
   title.textContent='Pay your Resplendent invoice';
   copy.textContent='Continue to our secure payment provider to settle the outstanding balance on this invoice.';
   actions.innerHTML='<button class="pay-button" id="start-pay">Continue to secure payment</button>'+contact;
   document.getElementById('start-pay').addEventListener('click',async function(){
     const b=this; b.disabled=true; b.textContent='Preparing secure checkout…';
     try{
       const r=await fetch('/api/payments/create.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invoice_id:invoice})});
       const d=await r.json(); if(!r.ok||!d.ok||!d.redirect_url) throw new Error(d.error||'Unable to start payment.');
       location.href=d.redirect_url;
     }catch(e){
       const message=(e && e.message) ? e.message : 'Unable to start payment.';
       copy.classList.add('pay-error');
       if(message.toLowerCase().includes('not payable online')){
         copy.textContent='Online payment is not currently available for this invoice. Please contact our Accounts team for assistance.';
         actions.innerHTML=contact;
       }else{
         copy.textContent=message;
         b.disabled=false;
         b.textContent='Try again';
       }
     }
   });
 }
 if(invoice) ref.textContent='Invoice reference: '+invoice;
})();
</script></body></html>
