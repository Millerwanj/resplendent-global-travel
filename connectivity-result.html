<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connectivity Order | Resplendent</title>
<style>
body{margin:0;background:#f7f4ec;color:#17201f;font-family:Arial,sans-serif}.box{max-width:720px;margin:10vh auto;padding:46px;background:white;border:1px solid #ddd8cc}
small{letter-spacing:.14em;text-transform:uppercase;color:#a98752}h1{font:400 38px Georgia,serif}.status{font-size:20px;color:#173c36;margin:25px 0}
button,a.btn{display:inline-block;border:0;background:#173c36;color:white;padding:14px 18px;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;font-size:12px;cursor:pointer}
#detail{line-height:1.7;color:#66716e}.error{color:#8b2d25}
</style></head><body><main class="box"><small>Resplendent Instant Connectivity</small><h1>Your connectivity order</h1>
<div id="status" class="status">Checking verified payment status…</div><div id="detail"></div><div id="actions"></div></main>
<script>
const p=new URLSearchParams(location.search), id=p.get('order_id'), statusEl=document.getElementById('status'), detail=document.getElementById('detail'), actions=document.getElementById('actions');
async function load(){
 if(!id){statusEl.textContent='Order reference missing.';return}
 try{
  const r=await fetch('/api/connectivity/status.php?order_id='+encodeURIComponent(id),{cache:'no-store'}), d=await r.json();
  if(!d.ok) throw new Error(d.message||'Order not found.');
  const o=d.order;
  statusEl.textContent=o.status==='PAID'?'Payment verified':o.status==='PROVISIONED'?'Sandbox eSIM provisioned':o.status.replaceAll('_',' ');
  detail.innerHTML='<p><strong>Order:</strong> '+o.id+'<br><strong>Plan:</strong> '+o.plan.name+'<br><strong>Total:</strong> '+o.currency+' '+o.amount+'</p>';
  if(o.status==='PAID' && o.payment_verified){
    actions.innerHTML='<button id="prov">Run sandbox provisioning test</button>';
    document.getElementById('prov').onclick=provision;
  } else if(o.status==='PROVISIONED'){
    actions.innerHTML='<p>Test complete. No real eSIM was issued.</p>';
  } else {
    actions.innerHTML='<a class="btn" href="/connectivity-checkout.html">Return to checkout</a>';
  }
 }catch(e){statusEl.textContent='We could not confirm this order.';detail.innerHTML='<p class="error">'+e.message+'</p>'}
}
async function provision(){
 const b=document.getElementById('prov');b.disabled=true;b.textContent='Provisioning test…';
 try{
  const r=await fetch('/api/connectivity/sandbox-provision.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_id:id})}), d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.message||'Provisioning test failed.');await load();
 }catch(e){detail.innerHTML+='<p class="error">'+e.message+'</p>';b.disabled=false;b.textContent='Run sandbox provisioning test'}
}
load();
</script></body></html>
